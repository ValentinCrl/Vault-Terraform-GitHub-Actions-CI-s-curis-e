worker_processes auto;
# PID dans un répertoire inscriptible par l'utilisateur non-root
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Chemins temporaires inscriptibles par l'utilisateur non-root
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout 65;

    # Ne pas divulguer la version de nginx
    server_tokens off;

    server {
        # Port non privilégié (pas besoin de root)
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Headers de sécurité
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Endpoint de santé pour les checks (Docker/K8s)
        location /healthz {
            access_log off;
            # default_type au lieu d'add_header pour ne pas écraser
            # les headers de sécurité hérités du bloc server
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
