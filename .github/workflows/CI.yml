name: Intégration Continue Vault + Terraform + GitHub Actions CI sécurisée
on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

permissions: read-all

jobs:

  terraform:
    name: "Terraform Format"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        # terraform_version: 0.13.0:

      - name: Terraform Format (tous les modules, récursif)
        id: fmt
        run: terraform fmt -check -recursive

  terraform-validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    needs: terraform  # Optional: make it run after Terraform Init
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init + Validate (tous les modules)
        id: validate
        run: |
          for dir in terraform terraform/harbor; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

  tflint:
    name: "TFLint Scanning"
    runs-on: ubuntu-latest
    needs: terraform-validate
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # - name: Cache plugin dir
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.tflint.d/plugins
      #     key: ${{ ubuntu-latest }}-tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.52.0

      - name: Show version
        run: tflint --version

      - name: Run TFLint (tous les modules)
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}
          # Même config (.tflint.hcl) appliquée à tous les modules, quel que soit --chdir
          TFLINT_CONFIG_FILE: ${{ github.workspace }}/terraform/.tflint.hcl
        run: |
          for dir in terraform terraform/harbor; do
            echo "::group::tflint $dir"
            tflint --chdir="$dir" --init
            tflint --chdir="$dir" -f compact
            echo "::endgroup::"
          done

  # This workflow contains a single job called "checkov"
  checkov:
    name: "Checkov Security Scanning"
    needs: [tflint]
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so follow-up steps can access it
      - uses: actions/checkout@v3

      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@v12
        with:
          # This will add both a CLI output to the console and create a results.sarif file
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        # Results are generated only on a success or failure
        # this is required since GitHub by default won't run the next step
        # when the previous one has failed. Security checks that do not pass will 'fail'.
        # An alternative is to add `continue-on-error: true` to the previous step
        # Or 'soft_fail: true' to checkov.
        if: success() || failure()
        with:
          sarif_file: results.sarif

  semgrep:
    name: Semgrep - Analyse de sécurité
    runs-on: ubuntu-24.04
    container:
      image: returntocorp/semgrep
    steps:
      # Récupérer le code
      - name: Checkout du code
        uses: actions/checkout@v4 # v4.2.2

      # Lancer le scan
      - name: Scan Semgrep
        run: |
          semgrep --config=p/security-audit \
                  --error \
                  --json \
                  -o semgrep-results.json \
                  .
          semgrep ci

      # Sauvegarder les résultats même si le scan échoue
      - name: Upload des résultats
        uses: actions/upload-artifact@v4 # v4.6.2
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

  trivy-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build image myapp/v1
        run: docker build -t myapp/v1 ./app

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'myapp/v1'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      # - name: Upload Trivy results
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  zap-scan:
    runs-on: ubuntu-latest
    name: ZAP Baseline Scan
    needs: [checkov, semgrep, trivy-scan]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build and Start Application
        # Remplacez ceci par vos commandes de build/docker-compose pour lancer l'app
        run: |
          docker build -t myapp/v1 ./app
          docker run -d --name myapp -p 8080:8080 myapp/v1
          # Attendre que l'application soit prête
          sleep 30

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          # cmd_options: '-a'
          # allow_issue_reporting: false
        # continue-on-error: true

  cosign:
    name: "Build, Push & Sign (Harbor)"
    needs: [zap-scan]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Pré-requis côté GitHub (Settings → Secrets and variables → Actions) :
    #   Variables : HARBOR_HOST     = harbor.tondomaine.fr   (le domaine n'est pas un secret)
    #   Secrets   : HARBOR_USERNAME = robot account Harbor (ex. robot$devsecops+ci)
    #               HARBOR_PASSWORD = token du robot account
    #               COSIGN_PRIVATE_KEY / COSIGN_PASSWORD (cosign generate-key-pair)
    env:
      IMAGE: ${{ vars.HARBOR_HOST }}/devsecops/moteur-recherche
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=long

      - name: Build and Push container image
        uses: docker/build-push-action@v6
        id: build-and-push
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
      - name: Sign image with Cosign (clé privée)
        env:
          TAGS: ${{ steps.docker_meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          # Cosign signe par digest (immuable), pas par tag mutable.
          # --new-bundle-format=false : ancien format simplesigning stocké en
          # tag sha256-<digest>.sig, que Harbor reconnaît comme signature.cosign
          # (coche verte "Signé"). Par défaut cosign v3 produit un Sigstore
          # bundle via referrers OCI 1.1 que Harbor classe en accessoire générique.
          # --use-signing-config=false : pas de config TUF Sigstore (inutile en
          # signature par clé) ; sinon cosign v3 impose --new-bundle-format=true.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${images}

      - name: Verify signature (gate)
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # Dérive la clé publique depuis la clé privée pour vérifier la signature
          # qu'on vient de produire (la CI échoue si la vérif échoue → étape bloquante).
          cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub
          cosign verify --new-bundle-format=false --key cosign.pub "${IMAGE}@${DIGEST}"
